name: Security Checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"

permissions: {}

jobs:
  workflows:
    # Only run on pull requests from the same repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Required workflows run in the context of the target repository, so a
      # config file committed here is not checked out. Write it to RUNNER_TEMP.
      # Third-party actions must be at least 7 days old; first-party labd/*
      # actions are exempt so our own fresh releases can be adopted right away.
      # Note: do not set the `min_age` input, the --min-age flag overrides rules.
      - name: Write pinact config
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          cat > "$RUNNER_TEMP/pinact.yaml" <<'EOF'
          version: 3
          min_age:
            value: 7
            always: true
          rules:
            - min_age: 0
              conditions:
                - expr: ActionRepoOwner == "labd"
          EOF

      - name: Pin actions
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        with:
          skip_push: true
          verify: true
          config: ${{ runner.temp }}/pinact.yaml

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          annotations: true
          min-severity: high
